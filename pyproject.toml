[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-graph-rag"
version = "0.1.0"
description = "Graph-grounded retrieval augmentation for offline Gemma 4 coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Hkate777"}]
keywords = ["code-graph", "retrieval", "SWE-agent", "Gemma", "RAG"]

[tool.setuptools.packages.find]
where = ["src"]
